# Vendora internal gateway.
#
# This config runs inside the vendora-gateway container and is the only entry
# point to the private application network. The host nginx forwards traffic to
# 127.0.0.1:8080, which maps to this listener.

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # Health probe: proxied to the API so it also validates database access.
    location = /healthz {
        access_log off;
        proxy_pass http://vendora-api:8080/healthz;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API and uploaded product images.
    location /api/ {
        proxy_pass http://vendora-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://vendora-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Admin SPA routes (locale-prefixed, e.g. /fa/admin/dashboard). The full
    # path is preserved so React Router can read the locale from the URL.
    location ~ ^/(fa|en)/admin(/|$) {
        proxy_pass http://vendora-admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Admin static assets built with base=/admin/ (e.g. /admin/assets/app.js).
    # The trailing slash strips the /admin/ prefix before forwarding.
    location /admin/ {
        proxy_pass http://vendora-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Storefront.
    location / {
        proxy_pass http://vendora-site:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
