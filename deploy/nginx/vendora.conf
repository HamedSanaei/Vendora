# Vendora origin server configuration for vendora.tofanservice.ir.
#
# Traffic flow: visitor -> Cloudflare (HTTPS) -> this nginx (HTTPS) ->
# 127.0.0.1:8080 (Docker gateway) -> application containers.
#
# Cloudflare real visitor IPs: the included file is generated by
# scripts/update-cloudflare-ips.sh from the official Cloudflare ranges.
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name vendora.tofanservice.ir;

    # Return 444 when the Host header does not match.
    if ($host != vendora.tofanservice.ir) {
        return 444;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vendora.tofanservice.ir;

    # Cloudflare Origin Certificate (Full strict mode). Files are installed
    # manually on the server; they are never stored in Git.
    ssl_certificate /etc/ssl/cloudflare/vendora.crt;
    ssl_certificate_key /etc/ssl/cloudflare/vendora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (HSTS must be consistent with Cloudflare settings).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything is forwarded to the Docker gateway bound to localhost.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
