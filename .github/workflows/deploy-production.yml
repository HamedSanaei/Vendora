name: Deploy Production

on:
  workflow_run:
    workflows: ["Build Production Images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vendora-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy deployment files to server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          host="$PROD_HOST"
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          # cc_host IPv6 syntax: root@[2001:db8::1]; IPv4/hostname: root@<server>
          if printf '%s' "$host" | grep -q ':'; then
            cc_host="$user@[$host]"
          else
            cc_host="$user@$host"
          fi
          scp -i "$HOME/.ssh/deploy_key" -P "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -r deploy scripts "$cc_host:/opt/vendora/"

      - name: Run deployment on server
        id: deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          host="$PROD_HOST"
          port="${PROD_PORT:-22}"
          user="${PROD_USER:-root}"
          # ssh accepts raw IPv6 literals directly: root@2001:db8::1 or root@host
          ssh -i "$HOME/.ssh/deploy_key" -p "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$user@$host" "chmod +x /opt/vendora/scripts/*.sh && bash /opt/vendora/scripts/deploy-production.sh '$SHA'"

      - name: Verify public endpoints from the runner
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          for url in \
            "https://vendora.tofanservice.ir/healthz" \
            "https://vendora.tofanservice.ir/" \
            "https://vendora.tofanservice.ir/fa/admin"; do
            curl -fsS --retry 10 --retry-delay 5 --retry-connrefused -o /dev/null "$url"
            echo "Public check passed: $url"
          done
          echo "Public endpoints verified for $SHA"

      - name: Deployment summary
        if: always()
        env:
          SHA: ${{ steps.version.outputs.sha }}
          STATUS: ${{ job.status }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Production Deployment

          | Item | Result |
          |---|---|
          | Deployment status | **$STATUS** |
          | Git SHA | \`${{ steps.version.outputs.sha }}\` |
          | Image tags | \`ghcr.io/${{ github.repository_owner }}/vendora-{api,site,admin}:${{ steps.version.outputs.sha }}\` |
          | Target environment | production |
          | Hostname | https://vendora.tofanservice.ir |
          | Server deployment | ${{ steps.deploy.conclusion || 'skipped' }} |
          | Cloudflare health | ${{ job.status == 'success' && 'Passed' || 'Failed' }} |
          | Rollback | ${{ job.status == 'success' && 'Not required' || 'See server logs /opt/vendora/logs' }} |

          ${{ job.status == 'success' && 'Deployment succeeded. The storefront, API, and admin panel are live.' || 'Deployment FAILED. Check the workflow logs and /opt/vendora/logs on the server. The previous version may have been restored automatically.' }}
          EOF
