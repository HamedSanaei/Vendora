name: CI

# CI runs for every push and pull request. For `main` pushes, these checks are
# the same as the threshold the production pipeline enforces before building
# images or deploying, but CI itself NEVER builds images or deploys. PRs run CI
# only.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No NuGet lock files are committed yet (no packages.lock.json), so a
      # setup-dotnet cache would fail. Keep this consistent with the backend
      # job in the production pipeline (deploy.yml).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vendora.slnx

      - name: Build
        run: dotnet build Vendora.slnx -c Release --no-restore

      - name: Test (if test projects exist)
        run: |
          if find . -name '*Tests.csproj' -o -name '*Test.csproj' | grep -q .; then
            dotnet test Vendora.slnx -c Release --no-build
          else
            echo "No test projects found; skipping tests."
          fi

  admin:
    name: Admin (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  site:
    name: Storefront (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
